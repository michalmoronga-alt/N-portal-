<!doctype html>
<html lang="sk" data-night="0" data-music="1" data-badge="0">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>N-portal – mock: ambientný režim</title>
<style>
  :root{color-scheme:dark;--text:#e9eef7;--muted:#98a3b6;--blue:#3d7de0;--blue2:#5b95f0;--cyan:#4fc8ff;--red:#c8403f;--claude:#d97757;--codex:#9fe0cf;
    --edge:rgba(255,255,255,.14);--glass:rgba(255,255,255,.06);--ease:cubic-bezier(.2,.8,.2,1);
    --busyDot:#8fc2ff;--waitDot:#c9b3ff;--doneDot:#7ee2b0;
    --dim:.42} /* ambient: jas pozadia (deň) */
  html[data-night="1"]{--dim:.22} /* noc 22:00–7:00 */
  *{box-sizing:border-box}
  html{height:100%;background:#000}
  body{height:100%;margin:0;color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;user-select:none;overflow:hidden}
  /* pozadie: video (10 s slučka), pod ním fotka ako záloha; jas riadi --dim */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
  .bg video,.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:var(--dim);transition:opacity 1.5s var(--ease)}
  .bg img{display:none}
  html[data-video="0"] .bg video{display:none} html[data-video="0"] .bg img{display:block}
  .bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}

  .amb{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* hodiny: veľké, v strede; každú minútu sa posunú o pár px (ochrana displeja) */
  .clock{text-align:center;transform:translate(var(--dx,0),var(--dy,0));transition:transform 2s var(--ease)}
  .clock .t{font-size:34vh;line-height:.9;font-weight:700;letter-spacing:-.04em;text-shadow:0 4px 30px rgba(0,0,0,.7)}
  .clock .d{margin-top:1.5vh;font-size:4vh;color:var(--muted)}
  html[data-night="1"] .clock .t{color:#cfd6e2}
  /* usage v rohu: malé kruhy s bodmi agentov */
  .rings{position:absolute;left:3vw;bottom:3vh;display:flex;gap:1.6vw}
  .rw{display:flex;flex-direction:column;align-items:center;gap:.4vh}
  .ring{position:relative;width:12vh;height:12vh}
  .ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-linecap:round}.ring .track{stroke:rgba(255,255,255,.1)}
  .ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3vh;font-weight:700}
  .rw .name{font-size:2vh;color:var(--muted)}
  .orbit{position:absolute;inset:0;pointer-events:none}
  .orbit i{position:absolute;left:50%;top:50%;width:1px;height:1px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c),0 0 12px var(--c);transform:translate(-50%,-50%) scale(0)}
  .orbit i.g{box-shadow:0 0 4px var(--c);filter:blur(.6px)}
  .ring::before{content:'';position:absolute;inset:6%;border-radius:50%;pointer-events:none}
  .ring.glow::before{animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 12px 2px rgba(124,77,255,.15)}50%{box-shadow:0 0 26px 8px rgba(124,77,255,.42)}}
  /* hudba dole: jeden riadok + equalizer cez celú šírku pri dolnom okraji */
  .music{position:absolute;left:0;right:0;bottom:0;height:34vh;pointer-events:none;opacity:0;transition:opacity 1s}
  html[data-music="1"] .music{opacity:1}
  .music canvas{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:.5;filter:blur(7px)}
  .music .np{position:absolute;left:0;right:0;bottom:2.4vh;text-align:center;font-size:2.6vh;color:var(--muted);text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .music .np b{color:var(--text);font-weight:600}
  /* štítok „čaká na teba“ ostáva aj v ambiente */
  .badge{position:absolute;top:2.5vh;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:1vw;padding:.6vh 2.2vw;border-radius:999px;font-size:2.6vh;font-weight:600;color:#e4d6ff;border:1px solid rgba(154,120,255,.8);background:linear-gradient(135deg,#3b1e6e,#7c4dff);animation:blink 1.2s infinite}
  html[data-badge="1"] .badge{display:flex}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  .badge svg{width:1.2em;height:1.2em;color:var(--claude)}
  .hint{position:absolute;bottom:1vh;right:2vw;font-size:1.8vh;color:rgba(255,255,255,.35)}

  .ctl{position:fixed;right:10px;bottom:10px;z-index:9;display:flex;gap:6px;padding:6px 8px;border-radius:14px;flex-wrap:wrap;max-width:60vw;justify-content:flex-end;align-items:center;background:rgba(20,24,30,.85);border:1px solid var(--edge)}
  .ctl button{font:inherit;font-size:1.9vh;color:var(--muted);background:transparent;border:1px solid var(--edge);border-radius:999px;padding:.5vh 1.4vw}
  .ctl button.on{color:#fff;background:var(--blue);border-color:var(--blue2)}
  .ctl .lbl{font-size:1.8vh;color:var(--muted);margin:0 2px 0 8px}
  .ctl.hide{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="lg-claude" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"><line x1="12" y1="2.5" x2="12" y2="8.5"/><line x1="12" y1="15.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="8.5" y2="12"/><line x1="15.5" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="9.2" y2="9.2"/><line x1="14.8" y1="14.8" x2="18.7" y2="18.7"/><line x1="18.7" y1="5.3" x2="14.8" y2="9.2"/><line x1="9.2" y1="14.8" x2="5.3" y2="18.7"/></g></symbol></defs></svg>

<div class="bg">
  <video src="ambient.mp4" autoplay muted loop playsinline></video>
  <img src="bg.jpg" alt="" />
</div>

<div class="amb">
  <div class="badge"><svg><use href="#lg-claude"/></svg>N‑portal čaká na teba</div>
  <div class="clock" id="clock"><div class="t">00:58</div><div class="d">sobota 19. septembra</div></div>

  <div class="rings">
    <div class="rw"><div class="ring" data-ring="codex"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44" stroke-width="9"/><circle cx="50" cy="50" r="44" stroke-width="9" stroke="var(--red)" stroke-dasharray="276.5" stroke-dashoffset="0" opacity=".8"/></svg><div class="lbl">100%</div><div class="orbit"></div></div><div class="name">Codex</div></div>
    <div class="rw"><div class="ring" data-ring="claude"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44" stroke-width="9"/><circle cx="50" cy="50" r="44" stroke-width="9" stroke="var(--blue)" stroke-dasharray="276.5" stroke-dashoffset="138" opacity=".9"/></svg><div class="lbl">50%</div><div class="orbit"></div></div><div class="name">Claude</div></div>
  </div>

  <div class="music"><canvas id="eq"></canvas><div class="np"><b>STOSLIV, IRIAS</b> – i can feel</div></div>
  <div class="hint">dotyk = späť do Station</div>
</div>

<div class="ctl" id="ctl">
  <span class="lbl">Noc:</span><button data-k="night" data-v="0" class="on">deň</button><button data-k="night" data-v="1">noc</button>
  <span class="lbl">Hudba:</span><button data-k="music" data-v="1" class="on">hrá</button><button data-k="music" data-v="0">nič</button>
  <span class="lbl">Agent:</span><button data-k="agent" data-v="busy" class="on">pracuje</button><button data-k="agent" data-v="waiting">čaká</button><button data-k="agent" data-v="none">nič</button>
  <span class="lbl">Pozadie:</span><button data-k="video" data-v="1" class="on">video</button><button data-k="video" data-v="0">fotka</button>
  <button id="hide">skryť</button>
</div>

<script>
const html = document.documentElement, rand = (a, b) => a + Math.random() * (b - a);
// ---------- hodiny + posun každú minútu (ochrana displeja) ----------
const clock = document.getElementById('clock');
function tickClock() {
  const d = new Date(); clock.querySelector('.t').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  clock.style.setProperty('--dx', rand(-12, 12).toFixed(0) + 'px'); clock.style.setProperty('--dy', rand(-8, 8).toFixed(0) + 'px');
}
tickClock(); setInterval(tickClock, 60000);

// ---------- body agentov na kruhoch (skrátená verzia z mock5) ----------
const COLORS = { busy: 'var(--busyDot)', waiting: 'var(--waitDot)', done: 'var(--doneDot)' };
class Dot { constructor(node, st) { this.node = node; this.st = st; node.style.setProperty('--c', COLORS[st]); this.a = 0; this.tr = 0; this.ph = 'grow'; this.size = 0; this.spd = 360 / rand(7, 11); this.next = rand(1.5, 4); this.pw = rand(1.2, 2.2); this.pp = rand(0, 6.28); this.ghosts = [0, 1, 2, 3].map(() => { const g = document.createElement('i'); g.className = 'g'; g.style.setProperty('--c', COLORS[st]); node.parentNode.insertBefore(g, node); return g; }); }
  tick(dt, t, R, base) {
    if (this.st === 'waiting') { this.next -= dt; if (this.next <= 0) { this.next = rand(1.5, 4); this.tgt = (Math.random() < .45 ? -1 : 1) * rand(18, 70); } this.spd += ((this.tgt ?? this.spd) - this.spd) * Math.min(1, dt * 1.6); }
    const step = this.spd * dt; this.a += step; this.tr += Math.abs(step);
    if (this.ph === 'grow') { this.size = Math.min(1, this.tr / 40); if (this.size >= 1) this.ph = 'run'; }
    else if (this.ph === 'run' && this.tr >= 320) this.ph = 'shrink';
    else if (this.ph === 'shrink') { this.size -= dt / .9; if (this.size <= 0) { this.ph = 'dead'; return; } }
    const pulse = 1 + .12 * Math.sin(t * this.pw + this.pp), lag = this.spd * .045;
    const put = (el, ang, sc, op) => { const r = (ang - 90) * Math.PI / 180; el.style.opacity = op; el.style.transform = `translate(calc(-50% + ${(Math.cos(r) * R).toFixed(1)}px), calc(-50% + ${(Math.sin(r) * R).toFixed(1)}px)) scale(${sc.toFixed(2)})`; };
    put(this.node, this.a, base * this.size * pulse, 1); this.ghosts.forEach((g, k) => put(g, this.a - lag * (k + 1), base * this.size * (.8 - k * .16), .55 - k * .12));
  }
  kill() { this.node.remove(); this.ghosts.forEach(g => g.remove()); }
}
class Swarm { constructor(el) { this.el = el; this.layer = el.querySelector('.orbit'); this.dots = []; this.st = 'none'; }
  set(st) { this.st = st; this.el.classList.toggle('glow', st === 'waiting'); if (st === 'none') { this.dots.forEach(d => d.ph = 'shrink'); return; } this.dots.forEach(d => { d.st = st; d.node.style.setProperty('--c', COLORS[st]); d.ghosts.forEach(g => g.style.setProperty('--c', COLORS[st])); }); const want = 2 + Math.floor(Math.random() * 3); while (this.dots.length < want) this.spawn(); }
  spawn() { const n = document.createElement('i'); this.layer.appendChild(n); this.dots.push(new Dot(n, this.st)); }
  tick(dt, t) { const R = this.el.clientWidth / 2 * .88, base = this.el.clientWidth * .075; for (let i = this.dots.length - 1; i >= 0; i--) { const d = this.dots[i]; d.tick(dt, t, R, base); if (d.ph === 'dead') { d.kill(); this.dots.splice(i, 1); if (this.st !== 'none') this.spawn(); } } }
}
const swarms = { codex: new Swarm(document.querySelector('[data-ring=codex]')), claude: new Swarm(document.querySelector('[data-ring=claude]')) };
swarms.claude.set('busy');

// ---------- equalizer cez celú šírku (drawA z mock6, simulovaná úroveň) ----------
const cv = document.getElementById('eq'), ctx = cv.getContext('2d'); const N = 56;
const bars = Array.from({ length: N }, () => ({ v: 0, seed: rand(0, 6.28), spd: rand(.7, 1.8) }));
let level = 0, env = 0, lastBeat = 0;
function simLevel(t) { if (html.dataset.music !== '1') { level += (0 - level) * .08; return level; } const beat = 60 / 124; if (t - lastBeat > beat) { lastBeat += beat; if (t - lastBeat > beat) lastBeat = t; env = .75 + Math.random() * .25; } env *= .94; const tg = .28 + env * .55 + Math.sin(t * 1.7) * .06; level += (tg - level) * .35; return Math.max(0, Math.min(1, level)); }
function resize() { const r = cv.getBoundingClientRect(); cv.width = Math.round(r.width); cv.height = Math.round(r.height); } resize(); addEventListener('resize', resize);
function drawA(t, lv, W, H) { const gap = W / N, bw = gap * .62; for (let i = 0; i < N; i++) { const b = bars[i]; const c = 1 - Math.abs(i - (N - 1) / 2) / ((N - 1) / 2); const noise = .55 + .45 * Math.sin(t * b.spd + b.seed) * Math.sin(t * .37 + b.seed * 2); b.v += (lv * (.25 + .75 * c) * noise - b.v) * .18; const h = Math.max(2, b.v * H * .95), x = i * gap + (gap - bw) / 2; let g = ctx.createLinearGradient(0, H - h, 0, H); g.addColorStop(0, 'rgba(30,34,40,0)'); g.addColorStop(.5, 'rgba(30,34,40,.55)'); g.addColorStop(1, 'rgba(30,34,40,.75)'); ctx.fillStyle = g; ctx.fillRect(x + bw * .35, H - h * .92, bw, h * .92); g = ctx.createLinearGradient(0, H - h, 0, H); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.35, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,.9)'); ctx.fillStyle = g; ctx.fillRect(x, H - h, bw, h); } }
let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000; const lv = simLevel(t); ctx.clearRect(0, 0, cv.width, cv.height); drawA(t, lv, cv.width, cv.height); Object.values(swarms).forEach(s => s.tick(dt, t)); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- ovládanie ----------
const ctl = document.getElementById('ctl');
ctl.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => {
  const k = b.dataset.k, v = b.dataset.v; ctl.querySelectorAll(`button[data-k="${k}"]`).forEach(x => x.classList.toggle('on', x === b));
  if (k === 'agent') { swarms.claude.set(v); html.dataset.badge = v === 'waiting' ? '1' : '0'; } else html.dataset[k] = v;
});
document.getElementById('hide').onclick = () => ctl.classList.add('hide');
let lastTap = 0; document.addEventListener('pointerdown', () => { const n = Date.now(); if (n - lastTap < 350) ctl.classList.remove('hide'); lastTap = n; });
</script>
</body>
</html>
